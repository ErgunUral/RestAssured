# Minimal GitLab CI configuration to avoid Auto DevOps conflicts
stages:
  - build
  - test
  - smoke-tests
  - deploy

variables:
  # Explicitly disable all Auto DevOps features
  AUTO_DEVOPS_ENABLED: "false"
  CODE_QUALITY_DISABLED: "true"
  SAST_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"
  SECRET_DETECTION_DISABLED: "true"
  CONTAINER_SCANNING_DISABLED: "true"
  
  # Maven settings
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

# Global cache settings
cache:
  paths:
    - .m2/repository/

# Build Stage
build_job:
  stage: build
  interruptible: true
  retry:
    max: 2
    when:
      - api_failure
      - stuck_or_timeout_failure
  script:
    - echo "🔨 Building Project..."
    - export PATH=/opt/homebrew/bin:$PATH
    - mvn $MAVEN_CLI_OPTS clean compile test-compile
  artifacts:
    paths:
      - target/
    expire_in: 1 hour

# Test Stage - Unit Tests
test_job:
  stage: test
  interruptible: true
  retry:
    max: 2
    when:
      - api_failure
      - stuck_or_timeout_failure
  script:
    - echo "🧪 Running Unit Tests..."
    - export PATH=/opt/homebrew/bin:$PATH
    - mvn $MAVEN_CLI_OPTS test -Dsurefire.suiteXmlFiles=testng-paytr-smoke.xml
  needs: ["build_job"]
  artifacts:
    paths:
      - target/surefire-reports/
      - target/allure-results/
    reports:
      junit: target/surefire-reports/*.xml
    expire_in: 1 week
    when: always

# Smoke Tests Stage (Runs on push)
smoke_tests_job:
  stage: smoke-tests
  timeout: 1h
  interruptible: true
  retry:
    max: 2
    when:
      - api_failure
      - stuck_or_timeout_failure
  script:
    - echo "🚀 Running Smoke Tests..."
    - export PATH=/opt/homebrew/bin:$PATH
    - mvn $MAVEN_CLI_OPTS test -Dsurefire.suiteXmlFiles=testng-paytr-smoke.xml -Dtest.environment=test
    - echo "📄 Generating Allure Report artifacts (fallback)..."
    - mvn $MAVEN_CLI_OPTS allure:report || true
  needs: ["build_job"]
  artifacts:
    paths:
      - target/surefire-reports/
      - target/allure-results/
      - target/site/allure-maven-plugin/
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# Scheduled Full Regression Test (Runs every 2 hours on the hour OR manually/push)
scheduled_full_test_job:
  stage: test
  timeout: 3h
  interruptible: true
  retry:
    max: 2
    when:
      - api_failure
      - stuck_or_timeout_failure
  script:
    - echo "⏰ Running Full Regression Suite..."
    - export PATH=/opt/homebrew/bin:$PATH
    - mvn $MAVEN_CLI_OPTS test -Dsurefire.suiteXmlFiles=testng-comprehensive.xml -Dtest.environment=test
    - echo "📄 Generating Allure Report artifacts (fallback)..."
    - mvn $MAVEN_CLI_OPTS allure:report || true
  needs: ["build_job"]
  artifacts:
    paths:
      - target/surefire-reports/
      - target/allure-results/
      - target/allure-report/
    reports:
      junit: target/surefire-reports/*.xml
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


# GitLab Pages Job - Generate and Publish Allure Report
pages:
  stage: deploy
  interruptible: true
  retry:
    max: 2
    when:
      - api_failure
      - stuck_or_timeout_failure
  script:
    - echo "📊 Generating Allure Report..."
    - export PATH=/opt/homebrew/bin:$PATH
    - mvn $MAVEN_CLI_OPTS allure:report
    - mkdir -p public
    - mv target/site/allure-maven-plugin/* public/ || mv target/allure-report/* public/
  needs: ["scheduled_full_test_job"]
  dependencies:
    - scheduled_full_test_job
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
