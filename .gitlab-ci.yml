# Minimal GitLab CI configuration to avoid Auto DevOps conflicts
stages:
  - build
  - test
  - smoke-tests
  - deploy

variables:
  # Explicitly disable all Auto DevOps features
  AUTO_DEVOPS_ENABLED: "false"
  CODE_QUALITY_DISABLED: "true"
  SAST_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"
  SECRET_DETECTION_DISABLED: "true"
  CONTAINER_SCANNING_DISABLED: "true"
  
  # Maven settings
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

# Global cache settings
cache:
  paths:
    - .m2/repository/

# Build Stage
build_job:
  stage: build
  script:
    - echo "🔨 Building Project..."
    - export PATH=/opt/homebrew/bin:$PATH
    - mvn $MAVEN_CLI_OPTS clean compile test-compile
  artifacts:
    paths:
      - target/
    expire_in: 1 hour

# Test Stage - Unit Tests
test_job:
  stage: test
  script:
    - echo "🧪 Running Unit Tests..."
    - export PATH=/opt/homebrew/bin:$PATH
    - mvn $MAVEN_CLI_OPTS test -Dsurefire.suiteXmlFiles=testng-paytr-smoke.xml
  needs: ["build_job"]
  artifacts:
    paths:
      - target/surefire-reports/
      - target/allure-results/
    expire_in: 1 week
    when: always

# Smoke Tests Stage (Runs on push)
smoke_tests_job:
  stage: smoke-tests
  script:
    - echo "🚀 Running Smoke Tests..."
    - export PATH=/opt/homebrew/bin:$PATH
    - mvn $MAVEN_CLI_OPTS test -Dsurefire.suiteXmlFiles=testng-paytr-smoke.xml -Dtest.environment=test
  needs: ["build_job"]
  artifacts:
    paths:
      - target/surefire-reports/
      - target/allure-results/
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# Scheduled Full Regression Test (Runs every 2 hours on the hour)
scheduled_full_test_job:
  stage: test
  script:
    - echo "⏰ Running Scheduled Full Regression Suite..."
    - export PATH=/opt/homebrew/bin:$PATH
    - mvn $MAVEN_CLI_OPTS test -Dsurefire.suiteXmlFiles=testng-comprehensive.xml -Dtest.environment=test
  needs: ["build_job"]
  artifacts:
    paths:
      - target/surefire-reports/
      - target/allure-results/
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# GitLab Pages Job - Generate and Publish Allure Report
pages:
  stage: deploy
  script:
    - echo "📊 Generating Allure Report..."
    - export PATH=/opt/homebrew/bin:$PATH
    - mvn $MAVEN_CLI_OPTS allure:report
    - mkdir -p public
    - mv target/site/allure-maven-plugin/* public/ || mv target/allure-report/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "test-results-feb-5-2026"
    - if: $CI_PIPELINE_SOURCE == "schedule"
